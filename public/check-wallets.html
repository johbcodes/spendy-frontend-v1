<!DOCTYPE html>
<html>
<head>
    <title>Check Wallets Storage</title>
    <style>
        body {
            font-family: monospace;
            padding: 20px;
            background: #1a1a1a;
            color: #00ff00;
        }
        pre {
            background: #000;
            padding: 15px;
            border-radius: 5px;
            overflow-x: auto;
        }
        button {
            background: #00ff00;
            color: #000;
            border: none;
            padding: 10px 20px;
            margin: 10px 5px;
            cursor: pointer;
            font-family: monospace;
            font-weight: bold;
        }
        button:hover {
            background: #00cc00;
        }
        .info { color: #00ffff; }
        .warning { color: #ffff00; }
        .error { color: #ff0000; }
    </style>
</head>
<body>
    <h1>🔍 Wallet Storage Inspector</h1>

    <button onclick="checkWallets()">Check Wallets</button>
    <button onclick="showAllStorage()">Show All Storage</button>

    <div id="output"></div>

    <script>
        function checkWallets() {
            const output = document.getElementById('output');
            const wallets = localStorage.getItem('spendy_wallets');

            if (!wallets) {
                output.innerHTML = '<p class="warning">⚠️ No wallets found in localStorage!</p>';
                return;
            }

            try {
                const parsed = JSON.parse(wallets);
                output.innerHTML = `
                    <h2 class="info">📊 Wallet Data:</h2>
                    <p>Total wallets: ${parsed.length}</p>
                    <pre>${JSON.stringify(parsed, null, 2)}</pre>

                    <h3>Wallets by Company:</h3>
                    <pre>${groupByCompany(parsed)}</pre>
                `;
            } catch (e) {
                output.innerHTML = `<p class="error">❌ Error parsing wallets: ${e.message}</p>`;
            }
        }

        function groupByCompany(wallets) {
            const grouped = {};
            wallets.forEach(w => {
                if (!grouped[w.companyId]) {
                    grouped[w.companyId] = [];
                }
                grouped[w.companyId].push({
                    name: w.name,
                    type: w.type,
                    balance: w.balance,
                    id: w.id
                });
            });
            return JSON.stringify(grouped, null, 2);
        }

        function showAllStorage() {
            const output = document.getElementById('output');
            const keys = Object.keys(localStorage).filter(k => k.startsWith('spendy_'));

            let html = '<h2 class="info">🗄️ All Spendy Storage:</h2>';
            keys.forEach(key => {
                const value = localStorage.getItem(key);
                try {
                    const parsed = JSON.parse(value);
                    html += `
                        <h3>${key}</h3>
                        <p>Type: ${Array.isArray(parsed) ? 'Array' : 'Object'} |
                           ${Array.isArray(parsed) ? `Length: ${parsed.length}` : `Keys: ${Object.keys(parsed).length}`}</p>
                        <pre>${JSON.stringify(parsed, null, 2)}</pre>
                    `;
                } catch (e) {
                    html += `
                        <h3>${key}</h3>
                        <p class="error">Cannot parse as JSON</p>
                        <pre>${value}</pre>
                    `;
                }
            });

            output.innerHTML = html;
        }

        // Auto-run on load
        checkWallets();
    </script>
</body>
</html>
